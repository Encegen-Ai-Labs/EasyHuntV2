# Docker keeps logs in a file per container; without a cap they fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - redis-data:/data
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies backend/migrations/*.sql (needs DATABASE_URL in backend/.env), then exits.
  # api and worker start only after it succeeds.
  migrate:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: python -m scripts.migrate
    restart: "no"
    mem_limit: 256m
    logging: *logging

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    # Two API processes: one busy with a slow request cannot stall the other, and the
    # limits and the queue live in Redis, so they are shared between the two.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "8000:8000"   # direct access for load tests; the app itself is served by "proxy" on port 80
    environment:
      CELERY_ENABLED: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      # Rate limits shared by every API process (database 1; the queue uses 0).
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    # Concurrency comes from CELERY_WORKER_CONCURRENCY (default 3, capped at 6
    # in app/tasks/celery_app.py), not from a CLI flag, so the cap always applies.
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO
    restart: unless-stopped
    mem_limit: 4g
    environment:
      CELERY_ENABLED: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping -d celery@$$HOSTNAME -t 5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The website (Next.js). Reached only through "proxy".
  web:
    build:
      context: ./Frontend
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging

  # The single public address: / goes to the website, /api/* to the backend.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    logging: *logging
    depends_on:
      - api
      - web

volumes:
  redis-data:
  caddy-data:

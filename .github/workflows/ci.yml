# Runs on every pull request into dev or main, and on every push to them.
# It answers one question before a human reviews: "does this change still work, and did it leak a secret?"
# The jobs run in parallel and use NO secrets and NO network to Supabase or Gemini, so a test that
# accidentally calls the real services fails here instead of spending money or touching real data.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# A newer push to the same branch cancels the older run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages (OCR engine the image tests expect)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
        env:
          # Deliberately fake: tests must never reach a real database or model.
          SUPABASE_URL: http://127.0.0.1:1
          SUPABASE_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
      - name: Lint (report only for now)
        run: pip install ruff && ruff check app --select E9,F63,F7,F82,F401 --output-format=github
        continue-on-error: true

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Lint (report only for now)
        run: npm run lint
        continue-on-error: true
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  docker:
    name: Backend image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t easyhunt-backend:ci backend
      - name: No secrets baked into the image
        run: |
          if docker run --rm --entrypoint sh easyhunt-backend:ci -c 'test -e /app/.env || find /app -name ".env*" ! -name ".env.example" | grep .'; then
            echo "A .env file is inside the image"; exit 1
          fi
      - name: Starts and answers /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SUPABASE_URL=http://127.0.0.1:1 -e SUPABASE_KEY=ci-placeholder -e GEMINI_API_KEY=ci-placeholder \
            easyhunt-backend:ci uvicorn app.main:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the scan reads history, not just the latest files
      - name: Secret scan (blocks the merge)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner --exit-code 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python dependency audit (report only)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
        continue-on-error: true
      - name: Node dependency audit (report only)
        run: cd Frontend && npm audit --omit=dev
        continue-on-error: true
